[project]
name = "synthimage"
version = "0.1.0"
description = "Generative compatibility trajectory pilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "diffusers>=0.30,<0.40",
    "huggingface-hub>=0.34,<1",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "pillow>=12.3",
    "scikit-learn>=1.9",
    "torch>=2.13",
    "transformers>=4.45,<5",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
