[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthimage"
version = "1.0.0"
description = "A controlled study of where AI-image forensic signals emerge inside a frozen diffusion pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "diffusers>=0.30,<0.40",
    "huggingface-hub>=0.34,<1",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "pillow>=12.3",
    "scikit-learn>=1.9",
    "scipy>=1.14",
    "torch>=2.13",
    "transformers>=4.45,<5",
    "lpips>=0.1.4",
    "gguf>=0.19.0",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/synthimage"]
